baseURL = "https://go-docutils.github.io/"
locale = "en-us"
title = "go-docutils"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

# The design comes from the landing kit, a Hugo module pinned in go.mod.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/favicon.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 11.42:1, bright on the dark background 4.32:1.
  base = "#312e81"
  deep = "#1e1c4f"
  bright = "#6366f1"
  shadow = "rgba(49,46,129,.7)"
  glow = "rgba(49,46,129,.6)"
  wash = "rgba(49,46,129,.10)"
  washDeep = "rgba(30,28,79,.06)"
  chipBg = "#ecedfd"
  chipBorder = "#d0d1fb"
  chipFg = "#1e1c4f"
  chipBgDark = "rgba(99,102,241,.14)"
  chipBorderDark = "rgba(99,102,241,.32)"
  chipFgDark = "#a9abf7"
  statsEnd = "#dadafc"
  bandText = "#e6e7fd"
  accent = "#312e81"
  accentDark = "#696cf2"

# The hero's buttons, rendered by landingkit's cta.html in the kit's order.
[[params.cta]]
  kind  = "docs"
  href  = "https://pkg.go.dev/github.com/go-docutils/docutils"
  label = "Reference"
[[params.cta]]
  kind  = "github"
  href  = "https://github.com/go-docutils"
  label = "GitHub"

# The architectures the tests RUN on, read from the library's CI.
[params.mantra]
  goarch = ["amd64"]
